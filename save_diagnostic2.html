<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Diagnostic v2</title>
<style>
  body{ margin:0; background:#0A1128; color:#fff; font-family:-apple-system,sans-serif; padding:20px; }
  h1{ font-size:16px; }
  .step{ background:#141B34; border-radius:10px; padding:14px; margin-bottom:10px; border:1px solid rgba(255,255,255,0.1); }
  .label{ font-size:11px; color:#8f95ac; text-transform:uppercase; margin-bottom:4px; }
  .ok{ color:#4ade80; } .fail{ color:#ff6b6b; } .pending{ color:#FFD60A; }
  pre{ white-space:pre-wrap; word-break:break-all; font-size:11.5px; background:#0A1128; padding:8px; border-radius:6px; margin:6px 0 0; }
</style>
</head>
<body>
  <h1>🔍 Real save-path diagnostic</h1>
  <p style="color:#aeb4c8;font-size:12.5px;">Tests the exact same network calls the form uses. Wait for all steps, screenshot everything.</p>
  <div id="steps"></div>

<script>
const FIREBASE_DB_URL = 'https://aazadi-ki-daud-default-rtdb.asia-southeast1.firebasedatabase.app';
const FIREBASE_DATA_URL = `${FIREBASE_DB_URL}/participants.json`;

const stepsEl = document.getElementById('steps');
function addStep(label){
  const div = document.createElement('div');
  div.className = 'step';
  div.innerHTML = `<div class="label">${label}</div><div class="pending">Running…</div>`;
  stepsEl.appendChild(div);
  return div;
}
function finish(div, ok, text, ms){
  div.innerHTML = `<div class="label">${div.querySelector('.label').textContent}</div><div class="${ok?'ok':'fail'}">${ok?'✅ OK':'❌ FAILED'} ${ms!==undefined ? '('+ms+'ms)' : ''}</div><pre>${text}</pre>`;
}

(async function run(){
  // Step 1: plain GET, no timeout, no AbortController — see raw behavior
  let s1 = addStep('1. Plain GET (no timeout wrapper)');
  const t1 = Date.now();
  try{
    const res = await fetch(FIREBASE_DATA_URL + '?t=' + Date.now(), { cache: 'no-store' });
    const text = await res.text();
    finish(s1, res.ok, 'status: ' + res.status + '\n' + text.slice(0,300), Date.now()-t1);
  }catch(e){
    finish(s1, false, 'THREW: ' + e.message, Date.now()-t1);
  }

  // Step 2: GET with AbortController timeout (same as the real site now uses)
  let s2 = addStep('2. GET with 7s AbortController timeout');
  const t2 = Date.now();
  try{
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 7000);
    const res = await fetch(FIREBASE_DATA_URL + '?t=' + Date.now(), { cache:'no-store', signal: controller.signal });
    clearTimeout(timer);
    const text = await res.text();
    finish(s2, res.ok, 'status: ' + res.status + '\n' + text.slice(0,300), Date.now()-t2);
  }catch(e){
    finish(s2, false, 'THREW: ' + e.message + (e.name==='AbortError' ? ' (timeout actually fired — network truly this slow/unreachable)' : ''), Date.now()-t2);
  }

  // Step 3: real write test
  let s3 = addStep('3. Real PUT write test');
  const t3 = Date.now();
  try{
    const getRes = await fetch(FIREBASE_DATA_URL + '?t=' + Date.now(), { cache:'no-store' });
    const current = await getRes.json().catch(()=>({}));
    const data = current || {};
    data['diagnostic-test'] = { name: 'Diagnostic Test', category: 'Option 1', logs: { '2026-08-08': 1 } };
    const putRes = await fetch(FIREBASE_DATA_URL, {
      method: 'PUT', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
    });
    const putText = await putRes.text();
    finish(s3, putRes.ok, 'status: ' + putRes.status + '\n' + putText.slice(0,300), Date.now()-t3);
  }catch(e){
    finish(s3, false, 'THREW: ' + e.message, Date.now()-t3);
  }

  // Step 4: browser/environment info — sometimes the issue is the browser itself
  let s4 = addStep('4. Browser info');
  finish(s4, true, 'UserAgent: ' + navigator.userAgent + '\nOnline: ' + navigator.onLine);
})();
</script>
</body>
</html>
