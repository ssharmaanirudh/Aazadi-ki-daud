<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup — Azaadi Ki Daud</title>
<style>
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0A1128; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    padding:24px; box-sizing:border-box;
  }
  .card{
    max-width:480px; width:100%; background:#141B34; border-radius:18px; padding:32px;
    text-align:center; border:1px solid rgba(255,255,255,0.1);
  }
  h1{ font-size:20px; margin:0 0 8px; }
  p{ color:#aeb4c8; font-size:14px; line-height:1.6; }
  .code-box{
    margin-top:24px; padding:20px; background:#0A1128; border-radius:12px;
    border:2px dashed #FF9933; font-size:22px; font-weight:700; letter-spacing:1px;
    word-break:break-all; font-family:monospace; color:#FFD60A;
  }
  .status{ margin-top:16px; font-size:13px; color:#8f95ac; }
  .copy-btn{
    margin-top:16px; padding:10px 22px; border-radius:8px; border:none;
    background:#FF9933; color:#1a0d00; font-weight:700; font-size:14px; cursor:pointer;
  }
  .spinner{
    width:32px;height:32px;border:3px solid rgba(255,255,255,0.2);border-top-color:#FF9933;
    border-radius:50%; margin:0 auto; animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <h1>🇮🇳 Setting up the leaderboard</h1>
    <p>This runs automatically — just wait a moment, then send Claude the code that appears below.</p>
    <div id="loading"><div class="spinner"></div></div>
    <div id="result" style="display:none;">
      <div class="code-box" id="codeDisplay"></div>
      <button class="copy-btn" onclick="copyCode()">Copy code</button>
      <div class="status" id="copyStatus"></div>
    </div>
    <div id="errorBox" style="display:none;">
      <p style="color:#ff6b6b;">Something went wrong. Please screenshot this page and send it back.</p>
      <p id="errorDetail" style="font-size:12px;color:#8f95ac;"></p>
    </div>
  </div>

<script>
let generatedCode = '';

function copyCode(){
  navigator.clipboard.writeText(generatedCode).then(()=>{
    document.getElementById('copyStatus').textContent = 'Copied! Now paste it in the chat.';
  }).catch(()=>{
    document.getElementById('copyStatus').textContent = 'Could not auto-copy — just type it manually.';
  });
}

(async function setup(){
  try{
    const res = await fetch('https://kvdb.io/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: 'email=flyingrunners.azaadi@gmail.com'
    });
    if(!res.ok) throw new Error('Request failed: ' + res.status);
    const bucketId = (await res.text()).trim();
    generatedCode = bucketId;
    document.getElementById('loading').style.display = 'none';
    document.getElementById('codeDisplay').textContent = bucketId;
    document.getElementById('result').style.display = 'block';
  }catch(e){
    document.getElementById('loading').style.display = 'none';
    document.getElementById('errorBox').style.display = 'block';
    document.getElementById('errorDetail').textContent = String(e);
  }
})();
</script>
</body>
</html>
